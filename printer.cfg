# printer.cfg -- Ender 5 Plus + BTT SKR Mini E3 V3.0 + Micro Swiss DD + CR Touch
#
# Copy this file to your Pi at: ~/printer_data/config/printer.cfg
# Also copy klipper_tft.cfg to:  ~/printer_data/config/klipper_tft.cfg
#
# Pre-flight checklist before first boot:
#   1. Find your MCU serial ID on the Pi: ls /dev/serial/by-id/
#      Replace the placeholder in [mcu] below.
#   2. Verify motor directions -- jog each axis a few mm before homing.
#      If an axis moves the wrong way, flip the ! on its dir_pin.
#   3. Calibrate Z offset: PROBE_CALIBRATE in Mainsail terminal.
#   4. Run PID autotune: M303 E0 S200 (hotend), M303 E-1 S60 (bed).
#   5. Calibrate e-steps: extrude 100 mm, measure actual, then:
#      new_rotation_distance = old_value * (actual_mm / 100)
#   6. Measure your CRTouch x_offset / y_offset on the Micro Swiss mount.

[include mainsail.cfg]

[force_move]
enable_force_move: True
[include klipper_tft.cfg]

# ============================================================
# BTT TFT35 BRIDGE
# Forwards serial between TFT P1 (ttyAMA0) and Klipper.
# Requires tftbridge.py in ~/klipper/klippy/extras/
# See: https://github.com/oldhui-uk/tftbridge
# ============================================================

[tftbridge]
tft_device: /dev/ttyAMA0
tft_baud: 250000
tft_timeout: 0
klipper_device: /home/pi/printer_data/comms/klippy.serial
klipper_baud: 250000
klipper_timeout: 0

# ============================================================
# MCU -- BTT SKR Mini E3 V3.0 (STM32G0B1) connected via USB
# ============================================================

[mcu]
# Replace with your actual ID from: ls /dev/serial/by-id/
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_460008000C50564837383420-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 500
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5.0

# ============================================================
# X AXIS -- homes to MAX (right side)
# ============================================================

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 350
position_min: 0
position_max: 350
homing_speed: 75
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC11
uart_address: 0
run_current: 0.800
stealthchop_threshold: 255
interpolate: true

# ============================================================
# Y AXIS -- homes to MAX (rear)
# ============================================================

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 350
position_min: 0
position_max: 350
homing_speed: 75
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PC11
uart_address: 2
run_current: 1.100
stealthchop_threshold: 250
interpolate: true

# ============================================================
# Z AXIS -- dual motors via Y-cable on single Z port
# CRTouch used as Z endstop (no mechanical Z endstop needed)
# ============================================================

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 400
homing_speed: 15
second_homing_speed: 5
homing_retract_dist: 2.0

[tmc2209 stepper_z]
uart_pin: PC11
uart_address: 1
run_current: 0.850
stealthchop_threshold: 999999

# ============================================================
# EXTRUDER -- Micro Swiss Direct Drive
# rotation_distance needs calibration (see checklist above)
# ============================================================

[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 23.127
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_Kp: 42.709   # PID-tuned values from Marlin (same 0-255 scale)
pid_Ki: 5.504
pid_Kd: 82.855
min_temp: 0
max_temp: 260
pressure_advance: 0.0   # calibrate separately -- Klipper PA ≠ Marlin LA
max_extrude_only_distance: 200

[tmc2209 extruder]
uart_pin: PC11
uart_address: 3
run_current: 0.650
stealthchop_threshold: 999999

# ============================================================
# HEATED BED
# ============================================================

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 129.498   # PID-tuned values from Marlin
pid_Ki: 11.730
pid_Kd: 953.106
min_temp: 0
max_temp: 130

# ============================================================
# FANS
# ============================================================

# Part cooling fan
[fan]
pin: PC6

# Hotend heatsink fan -- runs when hotend is above 50C
[heater_fan nozzle_cooling_fan]
pin: PC7
heater: extruder
heater_temp: 50.0
fan_speed: 0.5

# Electronics/controller fan -- runs when bed is above 45C
[heater_fan controller_fan]
pin: PB15
heater: heater_bed
heater_temp: 45.0

# ============================================================
# CR TOUCH
# x_offset / y_offset: distance from nozzle to probe tip.
# Measure on your specific Micro Swiss DD mount and update.
# Typical range: x -40 to -50, y -5 to -10 (probe is left/behind nozzle)
# z_offset: set via PROBE_CALIBRATE -- Klipper will manage it via SAVE_CONFIG
# ============================================================

[bltouch]
sensor_pin: ^PC2
control_pin: PA1
x_offset: -44.0
y_offset: -9.0
z_offset: 2.072
speed: 10
samples: 2
sample_retract_dist: 3.0
lift_speed: 40
samples_tolerance_retries: 3
stow_on_each_sample: False

# ============================================================
# SAFE Z HOME
# Moves nozzle so probe lands at bed center (175, 175) for Z homing
# ============================================================

[safe_z_home]
home_xy_position: 219, 184   # nozzle pos so probe lands at (175,175): 175+44=219, 175+9=184
speed: 60
z_hop: 10
z_hop_speed: 5

# ============================================================
# BED MESH
# mesh_min / mesh_max are probe positions (not nozzle positions)
# ============================================================

[bed_mesh]
speed: 80
horizontal_move_z: 5
mesh_min: 30, 30
mesh_max: 305, 340
probe_count: 5, 5
algorithm: bicubic
fade_start: 1
fade_end: 10

# ============================================================
# SCREW TILT ADJUST
# Uses CRTouch to measure height at each bed screw.
# Positions are nozzle positions (probe offset already applied).
# Verify against your actual screw locations.
# Run: SCREWS_TILT_CALCULATE in Mainsail terminal.
# ============================================================

[screws_tilt_adjust]
screw1_name: front_left
screw1: 55, 47
screw2_name: front_right
screw2: 350, 47
screw3_name: rear_right
screw3: 350, 310
screw4_name: rear_left
screw4: 55, 310
horizontal_move_z: 10
speed: 100
screw_thread: CW-M4


# ============================================================
# FILAMENT RUNOUT SENSOR (stock Ender 5 Plus sensor)
# ============================================================

[filament_switch_sensor filament_sensor]
switch_pin: ^PC15
pause_on_runout: true
runout_gcode: M600

# ============================================================
# NEOPIXEL CASE LIGHT -- 18x NEO_GRB strip on PA8
# ============================================================

[neopixel case_light]
pin: PA8
chain_count: 18
color_order: GRB
initial_RED: 0.5
initial_GREEN: 0.5
initial_BLUE: 0.5

# [virtual_sdcard], [display_status], and [pause_resume] are provided by mainsail.cfg

# ============================================================
# BOARD PINS
# ============================================================

[board_pins]
aliases:
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PB6,  EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB7, EXP1_10=<5V>,
    EXP2_1=PB14, EXP2_3=PB13,  EXP2_5=PB12, EXP2_7=PB8, EXP2_9=<GND>,
    EXP2_2=PB15, EXP2_4=PB6,   EXP2_6=PB5,  EXP2_8=<GND>, EXP2_10=<5V>

[display]
lcd_type: emulated_st7920
spi_software_miso_pin: PD8
spi_software_mosi_pin: PD6
spi_software_sclk_pin: PB9
en_pin: PB8
encoder_pins: ^PA10, ^PA9
click_pin: ^!PA15

[output_pin beeper]
pin: PB5

# ============================================================
# CANCEL PRINT -- park head at rear right, turn off heaters
# ============================================================

[gcode_macro CANCEL_PRINT]
description: Cancel print and park head at rear right
rename_existing: CANCEL_PRINT_BASE
gcode:
  CANCEL_PRINT_BASE
  {% if 'xyz' in printer.toolhead.homed_axes %}
    G91
    G1 Z10 F600
    G90
    G1 X350 Y350 F6000
  {% endif %}
  M104 S0
  M140 S0
  M84

[gcode_macro G29]
gcode:
  BED_MESH_CALIBRATE
  G1 X0 Y0 Z5 F4000

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 220
shaper_type_y: mzv
shaper_freq_y: 250

